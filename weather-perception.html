        function classifyTemperature(state, temp) {
            let t = stateTempPerception[state] || stateTempPerception.Default;
            if (temp < t.Cold) return 'Cold';
            if (temp < t.Cool) return 'Cool';
            if (temp < t.Fair) return 'Fair';
            if (temp < t.Warm) return 'Warm';
            return 'Hot';
        }

        function normalizeState(state) {
            if (!state) return "";
            state = state.trim();
            // e.g. New Mexico, North Dakota, etc.
            if (hvacSuggestions[state]) return state;
            if (hvacSuggestions[state.replace(/\s/g,"")]) return state.replace(/\s/g,"");
            return state.replace(/\s/g,"");
        }

        function showForecast(cityRaw, stateHint = undefined) {
            const forecastDiv = document.getElementById('forecast');
            forecastDiv.innerHTML = `<h2>Loading forecast for ${cityRaw}...</h2>`;
            fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(cityRaw)}&appid=${apiKey}&units=imperial`)
                .then(res => res.json())
                .then(data => {
                    if (!data.city || !data.list) {
                        forecastDiv.innerHTML = `<span style="color:red;">No weather data found for "${cityRaw}". Please check your city name.</span>`;
                        return;
                    }
                    let state = stateHint || data.city.state || cities[cityRaw]?.state || undefined;
                    if ((!state || !stateTempPerception[state]) && cityRaw.includes(',')) {
                        const part = cityRaw.split(',')[1].trim();
                        const stateMap = {
                            TX: "Texas", CA: "California", IL: "Illinois", AZ: "Arizona", PA: "Pennsylvania", FL: "Florida",
                            OH: "Ohio", NC: "North Carolina", CO: "Colorado", TN: "Tennessee", MI: "Michigan",
                            MD: "Maryland", WI: "Wisconsin", NM: "New Mexico", IN: "Indiana", WA: "Washington",
                            DC: "District of Columbia", MA: "Massachusetts", MO: "Missouri", KY: "Kentucky", OR: "Oregon",
                            NV: "Nevada", MN: "Minnesota", VA: "Virginia", LA: "Louisiana", OK: "Oklahoma",
                            NE: "Nebraska", HI: "Hawaii", AK: "Alaska", NJ: "New Jersey", ID: "Idaho", NY: "New York",
                            AL: "Alabama", AR: "Arkansas", CT: "Connecticut", DE: "Delaware", IA: "Iowa", KS: "Kansas",
                            ME: "Maine", MS: "Mississippi", MT: "Montana", NH: "New Hampshire", ND: "North Dakota",
                            RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", UT: "Utah", VT: "Vermont",
                            WV: "West Virginia", WY: "Wyoming"
                        };
                        const normalized = stateMap[part.toUpperCase()] || part;
                        state = stateTempPerception[normalized] ? normalized : "Default";
                    }
                    if (!state || !stateTempPerception[state]) state = "Default";
                    const perceptionSourceState = stateTempPerception[state] ? state : "Default";
                    forecastDiv.innerHTML = `<h2>5-Day Weather Forecast for ${cityRaw}${state && state !== 'Default' ? ' ('+state+')' : ''}</h2>`;
                    let daysShown = 0, dateTracker = {};
                    data.list.forEach(forecast => {
                        const dt = new Date(forecast.dt * 1000);
                        const dayKey = dt.toDateString();
                        if (!dateTracker[dayKey] && daysShown < 5) {
                            dateTracker[dayKey] = true;
                            daysShown++;
                            const temp = forecast.main.temp;
                            const perception = classifyTemperature(perceptionSourceState, temp);
                            let suggestState = normalizeState(state);
                            let suggestion = (
                                (hvacSuggestions[suggestState] && hvacSuggestions[suggestState][perception]) ||
                                (hvacSuggestions.Default && hvacSuggestions.Default[perception]) ||
                                "Ask us for your best local comfort solution!"
                            );
                            forecastDiv.innerHTML += `
                                <div class="forecast-entry">
                                    <div>
                                        <p><strong>${dt.toLocaleDateString()}</strong>: ${temp}°F &mdash; Perceived as <strong>${perception}</strong></p>
                                        <div class="suggestion">Recommended HVAC offer:</div>
                                        <div>${suggestion}</div>
                                    </div>
                                </div>
                            `;
                        }
                    });
                })
                .catch(() => {
                    forecastDiv.innerHTML = `<span style="color:red;">Could not fetch forecast. Please try again later.</span>`;
                });
        }

        function populateCityList() {
            const cityList = document.getElementById('cityList');
            cityList.innerHTML = '';
            Object.entries(cities).forEach(([city, data]) => {
                const p = document.createElement('p');
                p.textContent = `${city}, ${data.state}`;
                p.onclick = () => {
                    document.getElementById('cityInput').value = '';
                    showForecast(city, data.state);
                };
                cityList.appendChild(p);
            });
        }

        function filterCities() {
            const val = document.getElementById('citySearch').value.toLowerCase();
            document.querySelectorAll('#cityList p').forEach(p => {
                p.style.display = p.textContent.toLowerCase().includes(val) ? '' : 'none';
            });
        }

        function submitTypedCity() {
            const val = document.getElementById('cityInput').value.trim();
            if (!val) return;
            showForecast(val);
            document.getElementById('cityInput').blur();
        }

        window.onload = () => {
            populateCityList();
        };
    </script>
</body>
</html>
