<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Day Weather Forecast and Perception</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #2c3e50;
        }
        p {
            margin: 5px 0;
        }
        input {
            margin-bottom: 10px;
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .city-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: #fff;
        }
        .city-list p {
            cursor: pointer;
            padding: 5px;
            margin: 0;
        }
        .city-list p:hover {
            background-color: #f0f0f0;
        }
        #logo {
            width: 200px;
            margin-bottom: 20px;
        }
        .weather-icon {
            width: 50px;
            vertical-align: middle;
        }
        .forecast-entry {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            background: #fafaff;
            border-radius: 8px;
            padding: 10px 15px;
            box-shadow: 0 1px 3px rgba(30,40,60,0.06);
        }
        .forecast-entry p {
            margin-left: 10px;
        }
        .hvac-offer-label {
            color: #137a37;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 0;
        }
        #forecast {
            margin-top: 20px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- Logo at the top -->
    <img id="logo" src="SystemizedMedia%20Black%20Logo.png" alt="Logo" />

    <h1>5-Day Weather Forecast and Perception</h1>

    <!-- Search bar -->
    <input type="text" id="citySearch" placeholder="Search for a city..." oninput="filterCities()" />

    <!-- City list (populated dynamically) -->
    <div id="cityList" class="city-list"></div>

    <!-- Forecast results -->
    <div id="forecast"></div>

    <script>
        const apiKey = '7e8b04989662f1bdbeb41ebc8f680f99';

        // Define state temperature perceptions (with Fair)
        const stateTempPerception = {
            Texas:        { Cold: 50, Cool: 65, Warm: 75, Fair: 85, Hot: 90 },
            Pennsylvania: { Cold: 30, Cool: 50, Warm: 65, Fair: 75, Hot: 80 },
            Utah:         { Cold: 30, Cool: 50, Warm: 65, Fair: 80, Hot: 85 },
            Georgia:      { Cold: 40, Cool: 55, Warm: 70, Fair: 80, Hot: 85 },
        };

        // Define HVAC offer suggestions
        const hvacSuggestions = {
            Texas: {
                Cold:   "Promote heating system tune-ups or furnace checks.",
                Cool:   "Offer dual HVAC system checkups (heating & AC).",
                Warm:   "Highlight pre-season AC maintenance specials.",
                Fair:   "Advertise ductless mini splits or air purification upgrades.",
                Hot:    "Push emergency AC service or replacement offers."
            },
            Pennsylvania: {
                Cold:   "Promote furnace repair/replacement or emergency heat services.",
                Cool:   "Offer whole-home humidifier installs or heater tune-ups.",
                Warm:   "Highlight AC tune-up or replacement discounts.",
                Fair:   "Advertise energy-efficient upgrades or smart thermostats.",
                Hot:    "Promote rapid-response AC repair and install offers."
            },
            Utah: {
                Cold:   "Offer furnace inspection and emergency repair.",
                Cool:   "Promote seasonal HVAC check-ups.",
                Warm:   "Advertise early AC tune-ups.",
                Fair:   "Showcase smart thermostat installs.",
                Hot:    "Push AC replacement or repair specials."
            },
            Georgia: {
                Cold:   "Feature heat pump or furnace tune-ups.",
                Cool:   "Bundle HVAC service plans.",
                Warm:   "Run AC service specials.",
                Fair:   "Offer mini split installs or air quality upgrades.",
                Hot:    "Highlight fast AC repair or install."
            }
        };

        // Define cities and their coordinates
        const cities = {
            Houston: { state: 'Texas', lat: 29.7604, lon: -95.3698 },
            Lancaster: { state: 'Pennsylvania', lat: 40.0379, lon: -76.3055 },
            'Salt Lake City': { state: 'Utah', lat: 40.7608, lon: -111.8910 },
            Oakwood: { state: 'Georgia', lat: 34.2279, lon: -83.8771 }
        };

        // Classify temperature, now including "Fair"
        function classifyTemperature(state, temp) {
            const t = stateTempPerception[state];
            if (temp < t.Cold) return 'Cold';
            if (temp < t.Cool) return 'Cool';
            if (temp < t.Warm) return 'Warm';
            if (temp < t.Fair) return 'Fair';
            return 'Hot';
        }

        // Fetch weather data
        function fetchWeather(cityName, state) {
            const url = `https://api.openweathermap.org/data/2.5/forecast?q=${cityName}&appid=${apiKey}&units=imperial`;
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error(`Error fetching data for ${cityName}: ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    const forecastDiv = document.getElementById('forecast');
                    forecastDiv.innerHTML = `<h2>5-Day Weather Forecast for ${cityName}, ${state}</h2>`;

                    let shownDates = {};
                    let daysCount = 0;

                    for (let i = 0; i < data.list.length && daysCount < 5; i++) {
                        const forecast = data.list[i];
                        const forecastDate = new Date(forecast.dt * 1000);
                        const dayString = forecastDate.toDateString();

                        // Show the first entry for each day (for reliability)
                        if (!shownDates[dayString]) {
                            shownDates[dayString] = true;
                            daysCount++;

                            const temp = forecast.main.temp;
                            const perception = classifyTemperature(state, temp);
                            const iconCode = forecast.weather[0].icon;
                            const iconUrl = `https://openweathermap.org/img/wn/${iconCode}.png`;
                            // Defensive: fallback in case key is missing
                            const suggestion = (hvacSuggestions[state] && hvacSuggestions[state][perception])
                                ? hvacSuggestions[state][perception]
                                : 'No suggestion available for this state/perception.';

                            forecastDiv.innerHTML += `
                                <div class="forecast-entry">
                                    <img class="weather-icon" src="${iconUrl}" alt="Weather icon" />
                                    <div>
                                        <p>
                                            <strong>${forecastDate.toLocaleDateString()}:</strong> 
                                            ${temp}°F – Perceived as <strong>${perception}</strong>
                                        </p>
                                        <p class="hvac-offer-label">Recommended HVAC offer:</p>
                                        <p>${suggestion}</p>
                                    </div>
                                </div>
                            `;
                        }
                    }
                })
                .catch(error => {
                    const forecastDiv = document.getElementById('forecast');
                    forecastDiv.innerHTML = `<p style="color:red;">Failed to fetch data for ${cityName}, ${state}: ${error.message}</p>`;
                });
        }

        // Populate the city list
        function populateCityList() {
            const cityList = document.getElementById('cityList');
            cityList.innerHTML = '';
            Object.entries(cities).forEach(([cityName, cityData]) => {
                const cityElement = document.createElement('p');
                cityElement.innerText = `${cityName}, ${cityData.state}`;
                cityElement.onclick = () => fetchWeather(cityName, cityData.state);
                cityList.appendChild(cityElement);
            });
        }

        // Filter cities based on search input
        function filterCities() {
            const input = document.getElementById('citySearch').value.toLowerCase();
            const cityList = document.getElementById('cityList');
            const cityElements = cityList.getElementsByTagName('p');
            for (let i = 0; i < cityElements.length; i++) {
                const city = cityElements[i];
                const cityName = city.innerText.toLowerCase();
                city.style.display = cityName.includes(input) ? '' : 'none';
            }
        }

        window.onload = populateCityList;
    </script>
</body>
</html>
