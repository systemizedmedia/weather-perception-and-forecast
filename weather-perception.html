<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>5-Day Weather Forecast and Perception</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 30px; }
        h1 { color: #2c3e50; }
        input[type="text"] { width: 350px; padding: 12px; border-radius: 4px; border: 1px solid #bbb; font-size: 1.1em; margin-bottom: 10px; }
        button { padding: 12px 18px; font-size: 1.05em; background: #205085; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #137a37; }
        .city-list { max-height: 250px; overflow-y: auto; border: 1px solid #ddd; background: #fff; border-radius: 5px; padding: 8px; margin-bottom: 8px; }
        .city-list p { cursor: pointer; padding: 7px 10px; margin: 0; border-radius: 4px; }
        .city-list p:hover { background: #e9f6ef; }
        .forecast-entry { background: #fff; margin: 16px 0; border-radius: 8px; padding: 18px 22px; box-shadow: 0 1px 4px #0001; }
        .forecast-entry strong { color: #137a37; }
        .suggestion { font-weight: bold; color: #205085; }
        #forecast { margin-top: 28px; }
        .or { color: #888; font-size: 1em; margin: 7px 0 7px 0; text-align:center; }
    </style>
</head>
<body>
    <h1>5-Day Weather Forecast and Perception</h1>
    <input type="text" id="citySearch" placeholder="Search or type any city..." oninput="filterCities()" />
    <div class="or">OR</div>
    <form id="cityForm" onsubmit="submitTypedCity(); return false;">
        <input type="text" id="cityInput" placeholder="Type ANY city and state (e.g. Miami, FL)" required />
        <button type="submit">Show Forecast</button>
    </form>
    <div id="cityList" class="city-list"></div>
    <div id="forecast"></div>
    <script>
        const apiKey = '7e8b04989662f1bdbeb41ebc8f680f99';

        // Expand or edit this list as much as you want!
        const cities = {
            Houston: { state: 'Texas' },
            Dallas: { state: 'Texas' },
            Austin: { state: 'Texas' },
            'San Antonio': { state: 'Texas' },
            Lancaster: { state: 'Pennsylvania' },
            Philadelphia: { state: 'Pennsylvania' },
            Pittsburgh: { state: 'Pennsylvania' },
            Harrisburg: { state: 'Pennsylvania' },
            'Salt Lake City': { state: 'Utah' },
            Provo: { state: 'Utah' },
            Ogden: { state: 'Utah' },
            Oakwood: { state: 'Georgia' },
            Atlanta: { state: 'Georgia' },
            Savannah: { state: 'Georgia' },
            Macon: { state: 'Georgia' },
            Miami: { state: 'Florida' },
            Orlando: { state: 'Florida' },
            Denver: { state: 'Colorado' },
            Chicago: { state: 'Illinois' },
            Phoenix: { state: 'Arizona' },
            Seattle: { state: 'Washington' },
            Boston: { state: 'Massachusetts' },
            LosAngeles: { state: 'California' },
            'New York': { state: 'New York' },
            // ...add more!
        };

        // Perception thresholds
        const stateTempPerception = {
            Texas:        { Cold: 50, Cool: 65, Warm: 75, Fair: 85, Hot: 90 },
            Pennsylvania: { Cold: 30, Cool: 50, Warm: 65, Fair: 75, Hot: 80 },
            Utah:         { Cold: 30, Cool: 50, Warm: 65, Fair: 80, Hot: 85 },
            Georgia:      { Cold: 40, Cool: 55, Warm: 70, Fair: 80, Hot: 85 },
            Florida:      { Cold: 55, Cool: 65, Warm: 75, Fair: 85, Hot: 90 },
            Colorado:     { Cold: 32, Cool: 50, Warm: 65, Fair: 78, Hot: 85 },
            Illinois:     { Cold: 30, Cool: 50, Warm: 70, Fair: 80, Hot: 88 },
            Arizona:      { Cold: 50, Cool: 65, Warm: 80, Fair: 90, Hot: 100 },
            Washington:   { Cold: 35, Cool: 55, Warm: 70, Fair: 80, Hot: 85 },
            Massachusetts:{ Cold: 28, Cool: 48, Warm: 68, Fair: 78, Hot: 84 },
            California:   { Cold: 50, Cool: 60, Warm: 70, Fair: 80, Hot: 90 },
            'New York':   { Cold: 28, Cool: 48, Warm: 68, Fair: 78, Hot: 84 },
        };

        // HVAC suggestions
        const hvacSuggestions = {
            Texas: {
                Cold:   "Promote heating system tune-ups or furnace checks.",
                Cool:   "Offer dual HVAC system checkups (heating & AC).",
                Warm:   "Highlight pre-season AC maintenance specials.",
                Fair:   "Advertise ductless mini splits or air purification upgrades.",
                Hot:    "Push emergency AC service or replacement offers."
            },
            Pennsylvania: {
                Cold:   "Promote furnace repair/replacement or emergency heat services.",
                Cool:   "Offer whole-home humidifier installs or heater tune-ups.",
                Warm:   "Highlight AC tune-up or replacement discounts.",
                Fair:   "Advertise energy-efficient upgrades or smart thermostats.",
                Hot:    "Promote rapid-response AC repair and install offers."
            },
            Utah: {
                Cold:   "Offer furnace inspection and emergency repair.",
                Cool:   "Promote seasonal HVAC check-ups.",
                Warm:   "Advertise early AC tune-ups.",
                Fair:   "Showcase smart thermostat installs.",
                Hot:    "Push AC replacement or repair specials."
            },
            Georgia: {
                Cold:   "Feature heat pump or furnace tune-ups.",
                Cool:   "Bundle HVAC service plans.",
                Warm:   "Run AC service specials.",
                Fair:   "Offer mini split installs or air quality upgrades.",
                Hot:    "Highlight fast AC repair or install."
            },
            Florida: {
                Cold:   "Offer heat pump service specials.",
                Cool:   "Promote full HVAC inspections.",
                Warm:   "Highlight AC tune-up offers.",
                Fair:   "Push energy-efficient AC upgrades.",
                Hot:    "Push emergency AC repair or replacement."
            },
            Colorado: {
                Cold:   "Promote furnace safety checks.",
                Cool:   "Advertise whole-home humidifiers.",
                Warm:   "Highlight AC tune-ups.",
                Fair:   "Showcase smart thermostat upgrades.",
                Hot:    "Push rapid AC repair or install."
            },
            Illinois: {
                Cold:   "Furnace repair specials.",
                Cool:   "Humidifier installation.",
                Warm:   "AC tune-up offers.",
                Fair:   "Smart thermostat upgrades.",
                Hot:    "Emergency AC service."
            },
            Arizona: {
                Cold:   "Promote heating checks (rare!).",
                Cool:   "Pre-season AC offers.",
                Warm:   "AC tune-ups.",
                Fair:   "Mini split installation.",
                Hot:    "Emergency AC replacement."
            },
            Washington: {
                Cold:   "Heat pump and furnace service.",
                Cool:   "Whole-home humidifier installs.",
                Warm:   "AC tune-up specials.",
                Fair:   "Ductless system upgrades.",
                Hot:    "Emergency AC services."
            },
            Massachusetts: {
                Cold:   "Furnace service specials.",
                Cool:   "Humidifier or air purification upgrades.",
                Warm:   "AC tune-ups.",
                Fair:   "Smart thermostat installs.",
                Hot:    "AC replacement offers."
            },
            California: {
                Cold:   "Heat pump service.",
                Cool:   "HVAC inspections.",
                Warm:   "AC tune-ups.",
                Fair:   "Smart thermostat upgrades.",
                Hot:    "Emergency AC repair."
            },
            'New York': {
                Cold:   "Furnace safety checks.",
                Cool:   "HVAC service plans.",
                Warm:   "AC tune-up offers.",
                Fair:   "Smart home upgrades.",
                Hot:    "AC repair or replacement."
            }
        };

        function classifyTemperature(state, temp) {
            const t = stateTempPerception[state];
            if (!t) return 'Unknown';
            if (temp < t.Cold) return 'Cold';
            if (temp < t.Cool) return 'Cool';
            if (temp < t.Warm) return 'Warm';
            if (temp < t.Fair) return 'Fair';
            return 'Hot';
        }

        function showForecast(cityRaw, stateHint = undefined) {
            const forecastDiv = document.getElementById('forecast');
            forecastDiv.innerHTML = `<h2>Loading forecast for ${cityRaw}...</h2>`;
            fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(cityRaw)}&appid=${apiKey}&units=imperial`)
                .then(res => res.json())
                .then(data => {
                    if (!data.city || !data.list) {
                        forecastDiv.innerHTML = `<span style="color:red;">No weather data found for "${cityRaw}". Please check your city name.</span>`;
                        return;
                    }
                    // Try to get state name
                    let state = stateHint || (data.city.state || undefined);
                    // Fallback: from typed input if possible
                    if ((!state || !stateTempPerception[state]) && cityRaw.includes(',')) {
                        const part = cityRaw.split(',')[1].trim();
                        const normalized = part.length === 2 ? (
                            // 2-letter state to full name
                            { TX: 'Texas', PA: 'Pennsylvania', UT: 'Utah', GA: 'Georgia', FL: 'Florida', CO: 'Colorado', IL: 'Illinois', AZ: 'Arizona', WA: 'Washington', MA: 'Massachusetts', NY: 'New York', CA: 'California' }[part.toUpperCase()] || undefined
                        ) : part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
                        state = stateTempPerception[normalized] ? normalized : undefined;
                    }
                    if (!state) state = 'Unknown';

                    forecastDiv.innerHTML = `<h2>5-Day Weather Forecast for ${cityRaw}${state && state !== 'Unknown' ? ' ('+state+')' : ''}</h2>`;
                    let daysShown = 0, dateTracker = {};
                    data.list.forEach(forecast => {
                        const dt = new Date(forecast.dt * 1000);
                        const dayKey = dt.toDateString();
                        if (!dateTracker[dayKey] && daysShown < 5) {
                            dateTracker[dayKey] = true;
                            daysShown++;
                            const temp = forecast.main.temp;
                            const perception = classifyTemperature(state, temp);
                            let suggestion = 'No suggestion found for this area/weather.';
                            if (hvacSuggestions[state] && hvacSuggestions[state][perception]) {
                                suggestion = hvacSuggestions[state][perception];
                            }
                            forecastDiv.innerHTML += `
                                <div class="forecast-entry">
                                    <div>
                                        <p><strong>${dt.toLocaleDateString()}</strong>: ${temp}°F &mdash; Perceived as <strong>${perception}</strong></p>
                                        <div class="suggestion">Recommended HVAC offer:</div>
                                        <div>${suggestion}</div>
                                    </div>
                                </div>
                            `;
                        }
                    });
                })
                .catch(() => {
                    forecastDiv.innerHTML = `<span style="color:red;">Could not fetch forecast. Please try again later.</span>`;
                });
        }

        function populateCityList() {
            const cityList = document.getElementById('cityList');
            cityList.innerHTML = '';
            Object.entries(cities).forEach(([city, data]) => {
                const p = document.createElement('p');
                p.textContent = `${city}, ${data.state}`;
                p.onclick = () => {
                    document.getElementById('cityInput').value = ''; // Clear typed input
                    showForecast(city, data.state);
                };
                cityList.appendChild(p);
            });
        }

        function filterCities() {
            const val = document.getElementById('citySearch').value.toLowerCase();
            document.querySelectorAll('#cityList p').forEach(p => {
                p.style.display = p.textContent.toLowerCase().includes(val) ? '' : 'none';
            });
        }

        function submitTypedCity() {
            const val = document.getElementById('cityInput').value.trim();
            if (!val) return;
            showForecast(val);
            // Remove focus
            document.getElementById('cityInput').blur();
        }

        // Initialize on load
        window.onload = () => {
            populateCityList();
        };
    </script>
</body>
</html>
