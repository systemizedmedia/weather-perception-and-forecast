<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>5-Day Weather Forecast and Perception</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 30px; }
        h1 { color: #2c3e50; }
        input[type="text"] { width: 350px; padding: 12px; border-radius: 4px; border: 1px solid #bbb; font-size: 1.1em; margin-bottom: 10px; }
        button { padding: 12px 18px; font-size: 1.05em; background: #205085; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #137a37; }
        .forecast-entry { background: #fff; margin: 16px 0; border-radius: 8px; padding: 18px 22px; box-shadow: 0 1px 4px #0001; }
        .forecast-entry strong { color: #137a37; }
        .suggestion { font-weight: bold; color: #205085; }
        #forecast { margin-top: 28px; }
    </style>
</head>
<body>
    <h1>5-Day Weather Forecast and Perception</h1>
    <form id="cityForm" onsubmit="getForecast(); return false;">
        <input type="text" id="cityInput" placeholder="Enter any US city (e.g. Dallas, TX)" required />
        <button type="submit">Show Forecast</button>
    </form>
    <div id="forecast"></div>
    <script>
        const apiKey = '7e8b04989662f1bdbeb41ebc8f680f99';

        // Perception thresholds by state (you can expand as needed)
        const stateTempPerception = {
            Texas:        { Cold: 50, Cool: 65, Warm: 75, Fair: 85, Hot: 90 },
            Pennsylvania: { Cold: 30, Cool: 50, Warm: 65, Fair: 75, Hot: 80 },
            Utah:         { Cold: 30, Cool: 50, Warm: 65, Fair: 80, Hot: 85 },
            Georgia:      { Cold: 40, Cool: 55, Warm: 70, Fair: 80, Hot: 85 }
        };

        // Offer suggestions by state/perception
        const hvacSuggestions = {
            Texas: {
                Cold:   "Promote heating system tune-ups or furnace checks.",
                Cool:   "Offer dual HVAC system checkups (heating & AC).",
                Warm:   "Highlight pre-season AC maintenance specials.",
                Fair:   "Advertise ductless mini splits or air purification upgrades.",
                Hot:    "Push emergency AC service or replacement offers."
            },
            Pennsylvania: {
                Cold:   "Promote furnace repair/replacement or emergency heat services.",
                Cool:   "Offer whole-home humidifier installs or heater tune-ups.",
                Warm:   "Highlight AC tune-up or replacement discounts.",
                Fair:   "Advertise energy-efficient upgrades or smart thermostats.",
                Hot:    "Promote rapid-response AC repair and install offers."
            },
            Utah: {
                Cold:   "Offer furnace inspection and emergency repair.",
                Cool:   "Promote seasonal HVAC check-ups.",
                Warm:   "Advertise early AC tune-ups.",
                Fair:   "Showcase smart thermostat installs.",
                Hot:    "Push AC replacement or repair specials."
            },
            Georgia: {
                Cold:   "Feature heat pump or furnace tune-ups.",
                Cool:   "Bundle HVAC service plans.",
                Warm:   "Run AC service specials.",
                Fair:   "Offer mini split installs or air quality upgrades.",
                Hot:    "Highlight fast AC repair or install."
            }
        };

        // State extractor from OpenWeatherMap API result
        function extractState(data) {
            // Sometimes OWM returns 'state' in city or sys; often you need to map from city name to state (best effort here)
            // We'll try city.name, then maybe in the data there's 'state' (sometimes for US), else fallback to unknown
            if (data && data.city && data.city.state) return data.city.state;
            if (data && data.city && data.city.name) {
                // Simple mapping for demo; expand as needed for your audience
                const cityName = data.city.name;
                const lookup = {
                    Houston: 'Texas', Dallas: 'Texas', Austin: 'Texas', 'San Antonio': 'Texas',
                    Lancaster: 'Pennsylvania', Philadelphia: 'Pennsylvania', Pittsburgh: 'Pennsylvania', Harrisburg: 'Pennsylvania',
                    'Salt Lake City': 'Utah', Provo: 'Utah', Ogden: 'Utah',
                    Oakwood: 'Georgia', Atlanta: 'Georgia', Savannah: 'Georgia'
                };
                return lookup[cityName] || 'Unknown';
            }
            return 'Unknown';
        }

        function classifyTemperature(state, temp) {
            const t = stateTempPerception[state];
            if (!t) return 'Unknown';
            if (temp < t.Cold) return 'Cold';
            if (temp < t.Cool) return 'Cool';
            if (temp < t.Warm) return 'Warm';
            if (temp < t.Fair) return 'Fair';
            return 'Hot';
        }

        function getForecast() {
            const cityRaw = document.getElementById('cityInput').value.trim();
            const city = encodeURIComponent(cityRaw);
            const url = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=imperial`;
            const forecastDiv = document.getElementById('forecast');
            forecastDiv.innerHTML = `<h2>Loading forecast for ${cityRaw}...</h2>`;
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    if (!data.city || !data.list) {
                        forecastDiv.innerHTML = `<span style="color:red;">No weather data found for "${cityRaw}". Please check your city name.</span>`;
                        return;
                    }
                    // Get state if possible (for HVAC offer)
                    let state = extractState(data);
                    // If state is still 'Unknown', try to extract from input, e.g. "Dallas, TX" or "Atlanta, Georgia"
                    if (state === 'Unknown' && cityRaw.includes(',')) {
                        const part = cityRaw.split(',')[1].trim();
                        const normalized = part.length === 2 ? (
                            // 2-letter state to full name
                            { TX: 'Texas', PA: 'Pennsylvania', UT: 'Utah', GA: 'Georgia' }[part.toUpperCase()] || 'Unknown'
                        ) : part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
                        state = stateTempPerception[normalized] ? normalized : 'Unknown';
                    }
                    forecastDiv.innerHTML = `<h2>5-Day Weather Forecast for ${cityRaw} (${state})</h2>`;

                    let daysShown = 0, dateTracker = {};
                    data.list.forEach(forecast => {
                        const dt = new Date(forecast.dt * 1000);
                        const dayKey = dt.toDateString();
                        if (!dateTracker[dayKey] && daysShown < 5) {
                            dateTracker[dayKey] = true;
                            daysShown++;
                            const temp = forecast.main.temp;
                            const perception = classifyTemperature(state, temp);
                            let suggestion = 'No suggestion found for this area/weather.';
                            if (hvacSuggestions[state] && hvacSuggestions[state][perception]) {
                                suggestion = hvacSuggestions[state][perception];
                            }
                            forecastDiv.innerHTML += `
                                <div class="forecast-entry">
                                    <div>
                                        <p><strong>${dt.toLocaleDateString()}</strong>: ${temp}°F &mdash; Perceived as <strong>${perception}</strong></p>
                                        <div class="suggestion">Recommended HVAC offer:</div>
                                        <div>${suggestion}</div>
                                    </div>
                                </div>
                            `;
                        }
                    });
                })
                .catch(() => {
                    forecastDiv.innerHTML = `<span style="color:red;">Could not fetch forecast. Please try again later.</span>`;
                });
        }
    </script>
</body>
</html>
